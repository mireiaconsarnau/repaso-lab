# Publica la web en GitHub Pages (https://mireiaconsarnau.github.io/repaso-lab/) en cada push a main.
# Antes comprueba el banco de preguntas: si tools/validar_banco.py encuentra errores, no se publica.
# En el repositorio: Settings → Pages → Source: «GitHub Actions».
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar el banco de preguntas
        run: python3 -I tools/validar_banco.py
      - name: Construir la web
        run: python3 -I tools/construir_web.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
